name: Native Flow core
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-core:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run native core without Orca or network dependencies
        run: node --test --experimental-test-coverage tests/*.test.mjs
